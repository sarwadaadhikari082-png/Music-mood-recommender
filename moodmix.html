<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MoodMix — Music for however you feel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     1. COLORS — change these to reskin the whole page in one go
     ============================================================ */
  :root {
    --bg-deep: #1c1330;
    --bg-mid: #271a44;
    --card-bg: #2c1f4d;
    --card-bg-hover: #34275c;
    --text-main: #f6f2ff;
    --text-muted: #b6a8d6;
    --border-soft: rgba(255, 255, 255, 0.08);

    /* one accent color per mood — used for tags, bars, and buttons */
    --mood-happy: #ffd166;
    --mood-sad: #6c9bcf;
    --mood-chill: #7fd8be;
    --mood-hype: #ff6b6b;
    --mood-focus: #b892ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(ellipse at top, var(--bg-mid), var(--bg-deep) 65%);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  /* ============================================================
     2. HERO — title, tagline, mood-detect buttons
     ============================================================ */
  .hero {
    text-align: center;
    padding-bottom: 56px;
  }

  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-bottom: 22px;
  }

  /* the little bouncing bars — the visual "signature" of the page */
  .eq-bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 24px;
  }

  .eq-bars span {
    display: block;
    width: 5px;
    border-radius: 3px;
    animation: bounce 1.1s ease-in-out infinite;
  }
  .eq-bars span:nth-child(1) { background: var(--mood-happy); height: 40%; animation-delay: 0s; }
  .eq-bars span:nth-child(2) { background: var(--mood-hype);  height: 90%; animation-delay: 0.15s; }
  .eq-bars span:nth-child(3) { background: var(--mood-focus); height: 60%; animation-delay: 0.3s; }
  .eq-bars span:nth-child(4) { background: var(--mood-chill); height: 100%; animation-delay: 0.45s; }
  .eq-bars span:nth-child(5) { background: var(--mood-sad);   height: 55%; animation-delay: 0.6s; }

  @keyframes bounce {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .eq-bars span { animation: none; }
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    letter-spacing: -0.02em;
  }

  .tagline {
    color: var(--text-muted);
    font-size: 1.1rem;
    max-width: 480px;
    margin: 14px auto 36px;
  }

  .cta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
  }

  .btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.98rem;
    padding: 14px 26px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:hover { transform: translateY(-2px); }
  .btn:focus-visible { outline: 3px solid var(--mood-focus); outline-offset: 3px; }

  .btn-primary {
    background: linear-gradient(135deg, var(--mood-hype), var(--mood-happy));
    color: #24142f;
  }
  .btn-primary:hover { box-shadow: 0 8px 24px rgba(255, 107, 107, 0.35); }

  .btn-secondary {
    background: var(--card-bg);
    color: var(--text-main);
    border: 1px solid var(--border-soft);
  }
  .btn-secondary:hover { background: var(--card-bg-hover); }

  /* ============================================================
     3. MOOD PICKER — quick emoji buttons (fast, no typing needed)
     ============================================================ */
  .mood-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 30px;
  }

  .mood-chip {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.92rem;
    background: var(--card-bg);
    border: 1px solid var(--border-soft);
    color: var(--text-main);
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .mood-chip:hover { transform: translateY(-1px); }
  .mood-chip:focus-visible { outline: 3px solid var(--mood-focus); outline-offset: 2px; }
  .mood-chip[data-mood="happy"]:hover { border-color: var(--mood-happy); }
  .mood-chip[data-mood="sad"]:hover { border-color: var(--mood-sad); }
  .mood-chip[data-mood="chill"]:hover { border-color: var(--mood-chill); }
  .mood-chip[data-mood="hype"]:hover { border-color: var(--mood-hype); }
  .mood-chip[data-mood="focus"]:hover { border-color: var(--mood-focus); }

  /* ============================================================
     4. SAMPLE SONGS — recommendation cards
     ============================================================ */
  .section-label {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.4rem;
    margin-bottom: 6px;
  }

  .section-sub {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 24px;
  }

  .song-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }

  .song-card {
    background: var(--card-bg);
    border: 1px solid var(--border-soft);
    border-left: 4px solid var(--tag-color, var(--mood-chill));
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .song-card:hover {
    background: var(--card-bg-hover);
    transform: translateY(-2px);
  }

  .song-tag {
    align-self: flex-start;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--tag-color, var(--mood-chill));
    background: color-mix(in srgb, var(--tag-color, var(--mood-chill)) 18%, transparent);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .song-title {
    font-weight: 600;
    font-size: 1.02rem;
  }

  .song-artist {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-top: -6px;
  }

  .song-link {
    margin-top: auto;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-main);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    opacity: 0.85;
  }
  .song-link:hover { opacity: 1; text-decoration: underline; }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 64px;
  }

</style>
</head>
<body>

  <div class="wrap">

    <!-- ============================================================
         HERO
         ============================================================ -->
    <section class="hero">
      <div class="logo-row">
        <div class="eq-bars">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <h1>MoodMix</h1>
      <p class="tagline">
        Tell us how you feel, we'll hand you the songs that fit.
        No typing required — just pick a vibe.
      </p>

      <div class="cta-row">
        <button class="btn btn-primary" onclick="alert('This would open your camera to detect mood from a selfie — hook this up to your mood-detection logic!')">
          📸 Detect Mood from Selfie
        </button>
        <button class="btn btn-secondary" onclick="alert('This would open a text box where the user types how they feel.')">
          ✍️ Type How You Feel
        </button>
      </div>

      <!-- Quick mood buttons -- this is the fast MVP path (mood → hardcoded playlist) -->
      <div class="mood-picker" id="moodPicker">
        <button class="mood-chip" data-mood="happy">😄 Happy</button>
        <button class="mood-chip" data-mood="sad">😢 Sad</button>
        <button class="mood-chip" data-mood="chill">🌿 Chill</button>
        <button class="mood-chip" data-mood="hype">🔥 Hype</button>
        <button class="mood-chip" data-mood="focus">🎯 Focus</button>
      </div>
    </section>

    <!-- ============================================================
         SAMPLE RECOMMENDATIONS
         ============================================================ -->
    <section>
      <h2 class="section-label" id="sectionLabel">Sample vibes — Chill</h2>
      <p class="section-sub" id="sectionSub">Here's what we'd recommend right now. Click a mood above to swap it out.</p>

      <div class="song-grid" id="songGrid">
        <!-- Cards are generated by JS from the SONGS data below -->
      </div>
    </section>

    <footer>
      Built for a hackathon 🎉 &nbsp;·&nbsp; MoodMix is a demo, not a real music service.
    </footer>

  </div>

<script>

  /* ============================================================
     5. SONG DATA — this is the whole "database" for the MVP.
     To add or change songs, just edit this list. Each song needs:
     mood, title, artist, and a link (Spotify/YouTube search or URL).
     ============================================================ */
  const SONGS = {
    happy: [
      { title: "Walking on Sunshine", artist: "Katrina & The Waves", link: "https://open.spotify.com/search/Walking%20on%20Sunshine%20Katrina%20and%20the%20Waves" },
      { title: "Good as Hell", artist: "Lizzo", link: "https://open.spotify.com/search/Good%20as%20Hell%20Lizzo" },
      { title: "Uptown Funk", artist: "Mark Ronson ft. Bruno Mars", link: "https://open.spotify.com/search/Uptown%20Funk" },
      { title: "Happy", artist: "Pharrell Williams", link: "https://open.spotify.com/search/Happy%20Pharrell%20Williams" },
    ],
    sad: [
      { title: "Someone Like You", artist: "Adele", link: "https://open.spotify.com/search/Someone%20Like%20You%20Adele" },
      { title: "Fix You", artist: "Coldplay", link: "https://open.spotify.com/search/Fix%20You%20Coldplay" },
      { title: "Skinny Love", artist: "Bon Iver", link: "https://open.spotify.com/search/Skinny%20Love%20Bon%20Iver" },
      { title: "Liability", artist: "Lorde", link: "https://open.spotify.com/search/Liability%20Lorde" },
    ],
    chill: [
      { title: "Sunday Morning", artist: "Maroon 5", link: "https://open.spotify.com/search/Sunday%20Morning%20Maroon%205" },
      { title: "Come Away With Me", artist: "Norah Jones", link: "https://open.spotify.com/search/Come%20Away%20With%20Me%20Norah%20Jones" },
      { title: "Holocene", artist: "Bon Iver", link: "https://open.spotify.com/search/Holocene%20Bon%20Iver" },
      { title: "Sunflower", artist: "Rex Orange County", link: "https://open.spotify.com/search/Sunflower%20Rex%20Orange%20County" },
    ],
    hype: [
      { title: "Stronger", artist: "Kanye West", link: "https://open.spotify.com/search/Stronger%20Kanye%20West" },
      { title: "Can't Hold Us", artist: "Macklemore & Ryan Lewis", link: "https://open.spotify.com/search/Cant%20Hold%20Us%20Macklemore" },
      { title: "Titanium", artist: "David Guetta ft. Sia", link: "https://open.spotify.com/search/Titanium%20David%20Guetta" },
      { title: "POWER", artist: "Kanye West", link: "https://open.spotify.com/search/POWER%20Kanye%20West" },
    ],
    focus: [
      { title: "Weightless", artist: "Marconi Union", link: "https://open.spotify.com/search/Weightless%20Marconi%20Union" },
      { title: "Intro", artist: "The xx", link: "https://open.spotify.com/search/Intro%20The%20xx" },
      { title: "Strobe", artist: "Deadmau5", link: "https://open.spotify.com/search/Strobe%20Deadmau5" },
      { title: "An Ending (Ascent)", artist: "Brian Eno", link: "https://open.spotify.com/search/An%20Ending%20Ascent%20Brian%20Eno" },
    ],
  };

  // Matches the CSS variable names for each mood's accent color
  const MOOD_COLORS = {
    happy: "var(--mood-happy)",
    sad: "var(--mood-sad)",
    chill: "var(--mood-chill)",
    hype: "var(--mood-hype)",
    focus: "var(--mood-focus)",
  };

  const MOOD_LABELS = {
    happy: "Happy",
    sad: "Sad",
    chill: "Chill",
    hype: "Hype",
    focus: "Focus",
  };

  function renderSongs(mood) {
    const grid = document.getElementById("songGrid");
    const songs = SONGS[mood] || [];
    grid.innerHTML = "";

    songs.forEach(song => {
      const card = document.createElement("div");
      card.className = "song-card";
      card.style.setProperty("--tag-color", MOOD_COLORS[mood]);

      card.innerHTML = `
        <span class="song-tag">${MOOD_LABELS[mood]}</span>
        <span class="song-title">${song.title}</span>
        <span class="song-artist">${song.artist}</span>
        <a class="song-link" href="${song.link}" target="_blank" rel="noopener">Play on Spotify ↗</a>
      `;
      grid.appendChild(card);
    });

    document.getElementById("sectionLabel").textContent = `Sample vibes — ${MOOD_LABELS[mood]}`;
  }

  // Wire up the mood chip buttons
  document.querySelectorAll(".mood-chip").forEach(chip => {
    chip.addEventListener("click", () => renderSongs(chip.dataset.mood));
  });

  // Show "chill" by default on page load
  renderSongs("chill");

</script>

</body>
</html>
